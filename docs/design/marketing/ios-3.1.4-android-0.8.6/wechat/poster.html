<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>分工协作记录 · 棒球比赛记录大师 iOS 和 Android</title>
<!-- Brand 1.5: product lockup and parent signature are linked to the approved artwork. -->
<style>
* { box-sizing: border-box; }
body { margin: 0; color: #f8f3e6; background: #092a2a; font-family: "PingFang SC", sans-serif; }
main { width: 1080px; height: 1440px; padding: 64px; overflow: hidden; position: relative; }
header { text-align: center; }
header img { display: inline-block; height: 80px; }
.intro { margin-top: 77px; }
.versions { display: flex; gap: 24px; align-items: center; font: 600 30px/1.4 Arial,sans-serif; color: #b4dbb6; }
.versions i { width: 1px; height: 25px; background: #749e88; }
h1 { font-size: 113px; letter-spacing: -5px; line-height: 1.18; font-weight: 650; margin: 12px 0 24px -4px; }
p { font-size: 41px; line-height: 1.55; margin: 0; font-weight: 450; }
p + p { margin-top: 4px; }
.book { display: grid; grid-template-columns: 1fr 1fr; margin: 86px 3px 0; position: relative;
  transform: rotate(-2deg); border-radius: 9px; background: #f3efdb; color: #143b34;
  box-shadow: 0 5px 0 #c6c6a9,0 8px 0 #577063,0 17px 0 #245248,0 24px 38px #031e1b60; }
.leaf { min-height: 515px; padding: 32px 34px 30px; }
.leaf:first-child { border-radius: 9px 0 0 9px; background: linear-gradient(90deg, #f3efdb 91%,#e0dec6 99%,#b6b8a2); }
.leaf:last-child { border-radius: 0 9px 9px 0; background: linear-gradient(90deg,#d7d6be 0%,#f3efdb 8%); }
h2 { font-size: 43px; margin: 0; padding-bottom: 15px; line-height: 1.2; border-bottom: 3px solid #2a5143; }
.field { width: 100%; height: 277px; display: block; margin: 22px 0 7px; }
.count { display: flex; justify-content: center; align-items: center; gap: 26px; font-size: 24px; font-weight: 600; }
.count span { display: inline-flex; align-items: center; gap: 8px; }
.count i { display: inline-block; width: 13px; height: 13px; border: 2px solid #708477; border-radius: 50%; }
.count .marked { background: #275347; border-color: #275347; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: left; font-size: 29px; }
th { font-size: 22px; font-weight: 500; color: #476356; }
td,th { border-bottom: 1px solid #b2b7a3; height: 59px; }
th:first-child { width: 49%; }
td:first-child { font: 500 31px/1.2 "Courier New",monospace; }
td small { font: 600 20px/1.3 "PingFang SC",sans-serif; margin-left: 4px; white-space: nowrap; }
tbody tr:last-child { color: #8b4932; font-weight: 650; }
.example { text-align: right; margin: 29px 8px 0; font-size: 20px; color: #b5cbbb; }
footer { position: absolute; bottom: 64px; left: 64px; right: 64px; border-top: 1px solid #497269; padding-top: 27px; }
footer img { height: 32px; display: block; }
</style>
<main>
  <header><img src="../../../../../../../brand/specifications/1.3/assets/scorekeeper-horizontal-reverse.svg" alt="棒球比赛记录大师"></header>
  <section class="intro">
    <div class="versions"><span>iOS 3.1.4</span><i></i><span>Android 0.8.6</span></div>
    <h1>分工协作记录</h1>
    <p>一人管局面，一人管阵容，不会手忙脚乱</p>
    <p>临时增加队员，也可以好好研究对手</p>
  </section>
  <section class="book" aria-label="同场比赛记录示意">
    <div class="leaf">
      <h2>局面记录</h2>
      <svg class="field" viewBox="0 0 400 278" aria-label="一垒有人" role="img">
        <g stroke="#345d48" stroke-linejoin="round">
          <path d="M200 256 32 88 Q200 -65 368 88 Z" fill="#c4d1ae" stroke-width="2.5"/>
          <path d="M200 235 100 135 Q200 34 300 135 Z" fill="#e4cd9f" stroke-width="1.8"/>
          <path d="m200 222-78-78 78-78 78 78z" fill="#a6c09b" stroke-width="2.7"/>
          <circle cx="200" cy="144" r="10" fill="#e7d4b0" stroke-width="1.5"/>
          <g fill="#fcf8e8" stroke-width="2"><path d="m122 136 8 8-8 8-8-8z M200 58l8 8-8 8-8-8z"/>
          <path d="M193 215h14v9l-7 5-7-5z"/></g>
          <path d="m278 135 9 9-9 9-9-9z" fill="#a95636" stroke="#78452f" stroke-width="2"/>
          <path d="m209 218 62-62" fill="none" stroke="#a95636" stroke-width="2.5" stroke-dasharray="5 5"/>
        </g>
      </svg>
      <div class="count"><span>坏球<i class="marked"></i><i></i><i></i></span><span>好球<i class="marked"></i><i></i></span></div>
    </div>
    <div class="leaf">
      <h2>对手阵容</h2>
      <table>
        <thead><tr><th>背号</th><th>守位</th></tr></thead>
        <tbody>
          <tr><td>18</td><td>投手</td></tr>
          <tr><td>2</td><td>捕手</td></tr>
          <tr><td>7</td><td>一垒手</td></tr>
          <tr><td>36 <small>临时补入</small></td><td>游击手</td></tr>
        </tbody>
      </table>
    </div>
  </section>
  <div class="example">同场记录示意</div>
  <footer><img src="../../../../../../../brand/references/baseballmaster-2026-10-22/baseballmaster-horizontal-reverse.svg" alt="BaseballMaster"></footer>
</main></html>
