<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>棒球比赛记录大师 · iOS 3.1.3</title>
<style>
*{box-sizing:border-box}
:root{--ink:#102f2a;--paper:#f6f4eb;--rule:#bfc8ba}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
main{width:1080px;height:1800px;overflow:hidden}
h1,h2,p,figure,dl,dt,dd{margin:0}img{display:block}
header{height:105px;display:grid;place-items:center;background:#092a2a;position:relative}
header img{height:58px}header span{position:absolute;right:68px;font:450 28px "Helvetica Neue",sans-serif;color:#cbd9c9}
.hero{height:555px;position:relative;isolation:isolate;color:#fffdf2}
.field{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:center 51%}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(6,27,23,.85),transparent 66%)}
.scorebug{position:absolute;top:37px;left:46px;width:424px;filter:drop-shadow(0 2px 7px #10222055)}
.hero-copy{position:absolute;bottom:39px;left:65px}
h1{font:650 94px/1.12 "Songti SC",serif;letter-spacing:-.045em}
.hero-copy p{margin-top:13px;font-size:32px;line-height:1.5;color:#f6f4e7}
h2{font-size:47px;font-weight:650;line-height:1.22;letter-spacing:-.05em}
.copy{font-size:30px;line-height:1.5;letter-spacing:-.026em;color:#42584e}
.pair{height:371px;margin:0 64px;display:grid;grid-template-columns:1fr 1fr;gap:66px;padding:42px 0 26px;position:relative}
.pair:after{content:"";width:1px;background:var(--rule);position:absolute;top:45px;bottom:37px;left:50%}
.pair .copy{margin-top:11px}.pair figure{height:168px;margin-top:12px;display:flex;align-items:center}
.schedule img{width:100%;border-radius:13px}.runners img{height:166px;width:auto;margin:auto}
.analysis{height:405px;background:#dbe6d3;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 64px}
.analysis h2{font:700 62px/1.22 "Songti SC",serif;letter-spacing:-.05em}
.analysis .copy{margin-top:17px;color:#284b3a}
.sheet{position:absolute;width:398px;top:36px;left:602px;transform:rotate(3deg);box-shadow:0 8px 34px #10392930;background:#fff;padding:6px}
.sheet img{width:100%;height:auto}
.stats{height:250px;margin:0 64px;padding:33px 0 0}.stats h2{font-size:43px}
dl{display:flex;gap:0;margin-top:22px;border-top:1px solid var(--rule);padding-top:18px}
dl div{display:flex;align-items:baseline;gap:14px;flex:1}dt{font:500 52px/1.1 Baskerville,Georgia,serif;color:#214f40}dd{font-size:28px;color:#345446}
footer{height:114px;background:#092a2a;color:#e5eddf;display:flex;justify-content:space-between;align-items:center;padding:0 64px}footer img{height:32px}footer p{font-size:29px}
</style>
<main>
<header><img src="{{product}}" alt="棒球比赛记录大师"><span>iOS 3.1.3</span></header>
<section class="hero"><img class="field" src="{{ballpark}}" alt=""><img class="scorebug" src="{{scoreboard}}" alt="OBS 比分与投手叠加示例，海浪 2 比 1 飞鹰">
<div class="hero-copy"><h1>OBS 现场转播</h1><p>用浏览器源叠加比分、投手、当前打者和双方阵容。</p></div></section>
<div class="pair">
<section class="schedule"><h2>球队赛程</h2><p class="copy">队员打开「比赛」看赛程。</p><figure><img src="{{schedule}}" alt="队员看到的对阵、时间与场地"></figure></section>
<section class="runners"><h2>四垒核对与赛中纠错</h2><p class="copy">核对跑者去向，改正换人记录。</p><figure><img src="{{runners}}" alt="打者与跑者的四垒核对图"></figure></section>
</div>
<section class="analysis"><div><h2>在线比赛分析</h2><p class="copy">复盘单场、全年或指定场次，<br>分享文字或 PDF 报告。</p></div>
<figure class="sheet"><img src="{{report}}" alt="海浪对飞鹰的单场分析报告，含 MVP、比赛综述与关键局面"></figure></section>
<section class="stats"><h2>打击与捕手统计</h2><dl><div><dt>TB</dt><dd>打击总垒数</dd></div><div><dt>CCS</dt><dd>捕手阻杀</dd></div><div><dt>PB</dt><dd>捕逸</dd></div></dl></section>
<footer><img src="{{signature}}" alt="BaseballMaster"><p>切换页面、翻看长记录更流畅。</p></footer>
</main>
