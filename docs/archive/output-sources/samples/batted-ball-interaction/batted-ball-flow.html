}

phone.innerHTML=nav('核对结果','observe')+`<div class="bm-content">${person(s)}<div class="bm-location">${s.type||'球型未记录'}　·　${s.point?zone(s.point):'位置未记录'}</div><div class="bm-title">本球结果</div><div class="bm-choices">${results.map(r=>`<button type="button" data-result="${r}" aria-pressed="${s.result===r}">${r}</button>`).join('')}</div><div class="bm-note">安打不决定球型；接杀、双杀继续核对守备和实际出局者。</div><button class="bm-primary" type="button" data-action="review">继续核对</button><div class="bm-note">本页为常见结果演示，特殊结果仍使用现有完整流程。</div></div>`;return;
}
if(s.page==='review'){
const out=s.result.includes('杀')||s.result.includes('出局');
const details=s.result==='双杀'?`<div class="bm-title">谁出局？</div><div class="bm-choices"><button type="button" data-out="batter" aria-pressed="${s.outBatter}">打者 #23</button><button type="button" data-out="runner" aria-pressed="${s.outRunner}">跑者 #18</button></div><div class="bm-note">双杀需核对两个实际出局者。</div>`:`<div class="bm-panel"><div class="bm-review-line"><span>打者 #23 王星野</span><b>${out?'出局':s.result==='二垒安打'?'到二垒':s.result==='三垒安打'?'到三垒':s.result==='本垒打'?'回本垒':s.result==='其他结果'?'待继续核对':'到一垒'}</b></div><div class="bm-review-line"><span>跑者 #18 林宇轩</span><select data-runner="true" aria-label="跑者最终去向" style="background:var(--bm-surface);color:var(--bm-text);border:1px solid var(--bm-line);font:inherit;padding:7px;border-radius:8px"><option ${s.runner==='二垒'?'selected':''}>二垒</option><option ${s.runner==='三垒'?'selected':''}>三垒</option><option ${s.runner==='本垒'?'selected':''}>本垒</option><option ${s.runner==='留在一垒'?'selected':''}>留在一垒</option><option ${s.runner==='出局'?'selected':''}>出局</option></select></div></div>`;
phone.innerHTML=nav('确认本球记录','result')+`<div class="bm-content"><p class="bm-summary-title">${s.result||'一垒安打'}</p><div class="bm-panel"><div class="bm-review-line"><span>球型</span><b>${s.type||'未记录'}</b></div><div class="bm-review-line"><span>去向</span><b>${s.point?zone(s.point):'未记录'}</b></div><div class="bm-review-line"><span>打席</span><b>2局上 · 王星野第2打席</b></div></div>${s.point?field(`<path class="spray-line hit" d="M190 322L${s.point.x} ${s.point.y}"/><circle class="selected" cx="${s.point.x}" cy="${s.point.y}" r="9"/>`,'待保存的击球位置',210):''}${details}<button class="bm-primary" type="button" data-action="confirm">确认保存本球</button><div class="bm-note" aria-live="polite">${s.notice||'确认前不改变比分、出局数和打席。示例操作不保存实际比赛。'}</div></div>`;return;
}
if(s.page==='saved'){
phone.innerHTML=nav('本球已记录')+`<div class="bm-content"><div class="bm-success">✓ 示例记录完成</div>${person(s)}<div class="bm-panel"><div class="bm-review-line"><span>结果</span><b>${s.result||'一垒安打'}</b></div><div class="bm-review-line"><span>球型</span><b>${s.type||'未记录'}</b></div><div class="bm-review-line"><span>去向</span><b>${s.point?zone(s.point):'未记录'}</b></div></div><button class="bm-primary" type="button" data-action="history">查看打击表现</button><button class="bm-secondary" type="button" data-action="home">继续记分</button><div class="bm-note">演示数据，不写入 App 或服务器。</div></div>`;return;
}
if(s.page==='history'){
const year=s.scope==='year',marks=(year?data:data.filter(d=>d.current));
const event=marks.find(d=>d.id===s.event)||marks[0];
phone.innerHTML=nav('打击表现')+`<div class="bm-content">${person(s)}<div class="bm-segment" role="group" aria-label="打击统计范围"><button type="button" data-scope="game" aria-pressed="${!year}">本场</button><button type="button" data-scope="year" aria-pressed="${year}">2026 年</button></div><div class="bm-sub">${year?'我们记录的 3 场比赛 · 同一打者':'海浪 vs 飞鹰 · 本场已完成的打席'}</div><div class="bm-metrics"><div><b>${year?'8':'1'}</b><span>打席</span></div><div><b>${year?'3 / 7':'1 / 1'}</b><span>安打 / 打数</span></div><div><b>${year?'.429':'1.000'}</b><span>打击率 AVG</span></div></div><div class="bm-title">击球去向<span class="bm-sub">点标记查看这一次击球</span></div>${field(marks.map(markFor).join(''),'已记录击球去向，标记内文字区分地滚、强力地滚、平飞和高飞',250)}<div class="bm-legend"><span><i class="bm-dot"></i>安打</span><span><i class="bm-dot out"></i>出局</span><span><i class="bm-dot other"></i>失误／其他</span></div><div class="bm-note">${year?'已画 6 球；1 次击球未记位置。另 1 打席为保送。':'已画 1 球。当前打席尚未结束，不计入统计。'}　位置为大致区域。</div><div class="bm-panel" aria-live="polite"><div class="bm-list-row"><span class="bm-badge ${event.result==='出局'?'out':''}">${event.type}</span><div class="label"><strong>${event.detail}</strong><div>${event.date} · ${event.inning} · ${event.result}</div></div></div></div><div class="bm-note">本队／对方都可查看；年度只汇总我们记录到并有权查看的比赛。示例数据。</div></div>`;return;
}
}
root.querySelectorAll('.bm-phone').forEach(phone=>{
const saved=window.openai?.widgetState?.privateContent;
const s={page:'home',menu:false,type:null,point:null,result:null,player:'home',scope:'game',event:'a',runner:'二垒',outBatter:true,outRunner:true,notice:''};
if(saved&&['home','history'].includes(saved.page)){s.page=saved.page;s.player=saved.player==='opponent'?'opponent':'home';}
states.set(phone,s);render(phone);
phone.addEventListener('click',e=>{
const st=states.get(phone),b=e.target.closest('button'),map=e.target.closest('[data-map]'),event=e.target.closest('[data-event]');
if(map){const box=map.getBoundingClientRect(),scale=Math.min(box.width/380,box.height/285),offsetX=(box.width-380*scale)/2,offsetY=(box.height-285*scale)/2;
const p={x:Math.round((e.clientX-box.left-offsetX)/scale),y:Math.round((e.clientY-box.top-offsetY)/scale)+60};
if(p.x<8||p.x>372||p.y<65||p.y>329)return;st.point=p;render(phone);save(phone);return;}
if(event){st.event=event.dataset.event;render(phone);save(phone);return;}
if(!b)return;
if(b.dataset.shortcut){st.result=b.dataset.shortcut;st.type=st.result==='滚地出局'?'地滚':null;st.runner=['接杀','滚地出局'].includes(st.result)?'留在一垒':'二垒';st.point=null;st.page='observe';st.menu=false;}
else if(b.dataset.type){st.type=b.dataset.type;}
else if(b.dataset.result){st.result=b.dataset.result;st.runner=['接杀','滚地出局'].includes(st.result)?'留在一垒':st.result==='二垒安打'?'三垒':['三垒安打','本垒打'].includes(st.result)?'本垒':'二垒';}
else if(b.dataset.arrival){st.arrival=b.dataset.arrival;st.result=null;st.type=null;st.point=null;st.page='result';}
else if(b.dataset.scope){st.scope=b.dataset.scope;st.event='a';}
else if(b.dataset.out){if(b.dataset.out==='batter')st.outBatter=!st.outBatter;else st.outRunner=!st.outRunner;st.notice='';}
else {const a=b.dataset.action;
if(a==='menu')st.menu=!st.menu;
else if(a==='general'){st.page=phone.dataset.approach==='row'?'quick':'observe';st.result=null;st.type=null;st.point=null;st.menu=false;}
else if(a==='continue'){st.page=st.result?'review':'result';}
else if(a==='review'){if(!st.result)st.result='一垒安打';st.page='review';}

else if(a==='unknown-location')st.point=null;
else if(a==='skip'){st.type=null;st.point=null;st.page=st.result?'review':'result';}
else if(a==='player'){st.player=st.player==='home'?'opponent':'home';}
else if(a==='edit'){st.type=types.find(t=>t.startsWith((data.find(d=>d.id===st.event)||data[0]).type))||'高飞';st.point={x:103,y:148};st.result='一垒安打';st.page='observe';}
else if(a==='confirm'){if(st.result==='双杀'&&(!st.outBatter||!st.outRunner)){st.notice='请核对两个实际出局者后再保存。';}else st.page='saved';}
else if(['home','history','observe','result'].includes(a)){st.page=a;st.notice='';}
}
render(phone);save(phone);
});
phone.addEventListener('change',e=>{if(e.target.matches('[data-runner]')){states.get(phone).runner=e.target.value;save(phone);}if(e.target.matches('[data-region]')){states.get(phone).point=({left:{x:95,y:145},center:{x:190,y:115},right:{x:285,y:145},third:{x:145,y:250},second:{x:235,y:250}})[e.target.value]||null;render(phone);save(phone);}});
if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>render(phone)});tweak.addSelect(s,'player',{label:'演示打者所属',options:[{label:'本队打者',value:'home'},{label:'对方打者',value:'opponent'}]});}
});
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent;if(!saved)return;for(const [phone,s] of states){if(phone.dataset.approach!==(saved.approach||'menu'))continue;if(['home','history'].includes(saved.page))s.page=saved.page;s.player=saved.player==='opponent'?'opponent':'home';render(phone);}});
root.bmDemo={show(page,options={}){for(const [phone,s] of states){Object.assign(s,{page},options);render(phone);}},states,field};
})();
</script>
