# Included only inside baseballmaster.cc's HTTPS server block.
location = /admin { return 308 /admin/; }
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 4k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_buffering off;
    proxy_cache off;
    access_log off;
    error_log /dev/null crit;
}
location = /internal/admin-live { return 404; }
location ^~ /internal/admin-live/ { return 404; }
location ^~ /api/v3/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 18m;
    client_body_buffer_size 18m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    access_log off;
    error_log /dev/null crit;
}
location = /join { return 308 /join/; }
location = /pair { return 308 /pair/; }
location = /watch { return 308 /watch/; }
location ~ ^/(join|pair|watch)/(index\.html|[a-z-]+\.(js|css)|app-icon\.png)?$ {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    error_log /dev/null crit;
}
