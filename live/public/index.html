<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow,noarchive"><title>文字直播 · BaseballMaster</title><link rel="stylesheet" href="/livestreaming/novideo/style.css"><script defer src="/livestreaming/novideo/app.js"></script></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="/" aria-label="BaseballMaster 首页"><img src="/assets/app-icon.png" width="42" height="42" alt=""><span>BASEBALL<span class="brand-light">MASTER</span><small>棒球比赛记录大师</small></span></a><a class="live-home" href="/livestreaming/novideo/">文字直播</a></div></header>
<main><section id="gate" class="panel"><p class="eyebrow">FOLLOW THE GAME</p><h1>每一个打席，都不错过。</h1><p>输入 App 分享的场次串码，即可观赛。每 10 秒自动刷新。</p><form id="code-form"><label for="code">场次串码</label><input id="code" name="code" maxlength="24" autocomplete="off" spellcheck="false" placeholder="24 位场次串码" required><button type="submit">进入比赛 →</button></form></section>
<div id="message" role="status" aria-live="polite"></div>
<div id="match" hidden><section class="scoreboard panel"><div class="score-top"><span id="phase" class="tag"></span><span id="mode"></span></div><div class="teams"><div><span class="side">客队</span><h2 id="away-name"></h2></div><strong id="score"></strong><div><span class="side">主队</span><h2 id="home-name"></h2></div></div><div class="innings"><table aria-label="逐局比分"><thead id="innings-head"></thead><tbody id="innings-body"></tbody></table></div><div class="situation"><div><span class="eyebrow">当前局面</span><p id="count"></p></div><div class="bases" aria-label="垒上跑者"><span id="base-2"></span><span id="base-3"></span><span id="base-1"></span></div><div id="runners"></div></div><div class="matchup"><div><span id="batter-label" class="side">打者</span><strong id="batter"></strong></div><div><div class="matchup-heading"><span id="pitcher-label" class="side">投手</span><span id="pitch-count"></span></div><strong id="pitcher"></strong></div></div><p id="notice" class="notice" hidden></p><div class="sync"><span id="connection"></span><span id="synced"></span></div></section>
<div class="timeline-title"><div><p class="eyebrow">PLAY BY PLAY</p><h1>打席实况</h1></div><label>半局 <select id="half-select" aria-label="跳转半局"></select></label></div><button id="updates" hidden>有新的比赛记录 · 点击更新</button><div id="timeline"></div><button id="more" hidden>加载更早的半局</button><button id="current" class="floating">回到最新 ↑</button><p id="expiry" class="footnote"></p></div>
<footer>BaseballMaster · 每 10 秒更新<br>以记分员记录为准。终场一小时后，直播链接与云端记录自动删除。<br><a href="/privacy.html">隐私政策</a> · <a href="/support.html">技术支持</a></footer></main></body></html>
