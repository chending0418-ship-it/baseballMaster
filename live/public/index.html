<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow,noarchive">
<title>文字直播 · BaseballMaster</title><meta name="description" content="比赛文字直播"><meta property="og:title" content="文字直播 · BaseballMaster"><meta property="og:description" content="比赛文字直播"><meta property="og:type" content="website">
<link rel="stylesheet" href="/livestreaming/novideo/style.css"><script defer src="/livestreaming/novideo/app.js"></script>
</head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="/" aria-label="BaseballMaster 首页"><img src="/livestreaming/novideo/app-icon.png" width="42" height="42" alt=""><span>BASEBALL<span class="brand-light">MASTER</span><small>棒球比赛记录大师</small></span></a><a class="live-home" href="/livestreaming/novideo/">文字直播</a></div></header>
<main>
<section id="gate" class="panel"><p class="eyebrow">FOLLOW THE GAME</p><h1>每一个打席，都不错过。</h1><p>输入 App 分享的场次串码，即可观赛。每 10 秒自动刷新。</p><form id="code-form"><label for="code">场次串码</label><input id="code" name="code" maxlength="24" autocomplete="off" spellcheck="false" placeholder="24 位场次串码" required><button type="submit">进入比赛 →</button></form></section>
<div id="message" role="status" aria-live="polite"></div>
<div id="match" hidden>
<div id="live-view">
<section class="scoreboard panel" aria-label="比赛记分牌">
<div class="score-top"><div class="score-meta"><span id="live-dot" class="live-dot" role="img" aria-label="实时更新"></span><span id="mode"></span><span id="rules"></span></div><button id="open-lineups" class="lineup-button" type="button">查看双方阵容</button></div>
<div class="teams"><div class="team"><span class="side">客队</span><h2 id="away-name"></h2></div><strong id="away-score" class="big-score"></strong><div class="phase"><strong id="phase"></strong><span id="game-status"></span></div><strong id="home-score" class="big-score"></strong><div class="team home-team"><span class="side">主队</span><h2 id="home-name"></h2></div></div>
<p id="game-time" class="game-time"></p>
<div class="innings"><table aria-label="逐局比分，未开始的半局显示短横线"><colgroup id="innings-cols"></colgroup><thead id="innings-head"></thead><tbody id="innings-body"></tbody></table></div>
<div id="matchup" class="matchup" role="group" aria-label="当前投打对决"><div class="duel-player"><span id="batter-label" class="duel-label">当前打者</span><strong id="batter"></strong><span id="batter-stats" class="duel-stats"></span></div><span class="duel-vs" aria-label="对阵">VS</span><div class="duel-player duel-pitcher"><span id="pitcher-label" class="duel-label">当前投手</span><strong id="pitcher"></strong><span id="pitch-count" class="duel-stats"></span></div></div>
<div class="score-footer"><p id="next-batters" aria-label="后两位待打"></p><p id="synced"></p></div>
<p id="notice" class="notice" hidden></p><p id="connection" class="connection" role="status" aria-live="polite" hidden></p>
</section>
<div class="timeline-title"><h1>打席实况</h1><label>半局 <select id="half-select" aria-label="跳转半局"></select></label></div><button id="updates" hidden>有新的比赛记录 · 点击更新</button><div id="timeline"></div><button id="more" hidden>加载更早的半局</button><button id="current" class="floating">回到最新 ↑</button><p id="expiry" class="footnote"></p>
</div>
<section id="lineup-view" class="panel" aria-label="双方当前阵容" hidden>
<div class="lineup-heading"><button id="close-lineups" class="back-button" type="button">← 返回直播</button><h1>双方当前阵容</h1></div>
<div class="team-tabs" role="tablist" aria-label="选择球队阵容"><button id="away-tab" type="button" role="tab" aria-controls="roster-panel" aria-selected="true" data-team="away"></button><button id="home-tab" type="button" role="tab" aria-controls="roster-panel" aria-selected="false" data-team="home"></button></div>
<div id="roster-panel" role="tabpanel" aria-labelledby="away-tab"><p id="lineup-pitcher" class="roster-pitcher"></p><table class="roster" aria-label="当前上场阵容"><thead><tr><th scope="col">棒次</th><th scope="col">球员</th><th scope="col">守位</th></tr></thead><tbody id="roster-body"></tbody></table><p id="lineup-empty" class="empty" hidden></p><p id="lineup-synced" class="footnote"></p></div>
</section>
</div>
<footer>BaseballMaster · 每 10 秒更新<br>以记分员记录为准。终场一小时后，直播链接与云端记录自动删除。<br><a href="/privacy.html">隐私政策</a> · <a href="/support.html">技术支持</a> · <a href="/support.html#live-report">反馈直播内容</a></footer>
</main></body></html>
