# Paste INSIDE the dedicated HTTPS server {} for baseballmaster.cc.
# Keep certificate and ACME challenge settings. Merge existing matching locations;
# do not paste into the internal site or share its document root.
# For the homepage/static allow-list and 404 fallback, also merge
# ../../website/deploy/nginx-homepage.conf. This snippet adds ONLY live routes.
location = /livestreaming/novideo {
    return 308 /livestreaming/novideo/;
}
location ^~ /livestreaming/novideo/ {
    # No trailing slash: preserve /livestreaming/novideo/... when forwarding.
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_cache off;
    proxy_buffering off;
    # Match codes must not enter durable access/error logs.
    access_log off;
    error_log /dev/null crit;
}
