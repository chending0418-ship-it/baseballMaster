# Paste INSIDE the existing HTTPS server {} for jingsen.cc. Do not replace the whole site config.
location = /baseballmaster/live {
    return 308 /baseballmaster/live/;
}
location ^~ /baseballmaster/live/ {
    # No trailing slash: preserve /baseballmaster/live/... when forwarding.
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_cache off;
    proxy_buffering off;
    # Match codes must not enter durable access/error logs.
    access_log off;
    error_log /dev/null crit;
}
