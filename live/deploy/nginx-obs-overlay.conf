# Include in the existing baseballmaster.cc HTTPS server.
location = /livestreaming/novideo/overlay {
    alias /opt/baseballmaster-production/overlays/current/overlay.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}
location = /livestreaming/novideo/overlay.css {
    alias /opt/baseballmaster-production/overlays/current/overlay.css;
    default_type text/css;
    add_header Cache-Control "no-store" always;
}
location = /livestreaming/novideo/overlay.js {
    alias /opt/baseballmaster-production/overlays/current/overlay.js;
    default_type text/javascript;
    add_header Cache-Control "no-store" always;
}
