  <title>加入球队 · 棒球比赛记录大师</title>
  <meta name="description" content="通过 BaseballMaster 邀请链接加入共享球队，无需注册账号。">
  <meta property="og:title" content="加入球队 · 棒球比赛记录大师"><meta property="og:description" content="通过 BaseballMaster 邀请链接加入共享球队，无需注册账号。"><meta property="og:type" content="website"><meta property="og:site_name" content="BaseballMaster">
  <meta property="og:image" content="https://baseballmaster.cc/assets/app-icon.png?v=20261014">
  <meta property="og:image:secure_url" content="https://baseballmaster.cc/assets/app-icon.png?v=20261014">
  <meta property="og:image:type" content="image/png"><meta property="og:image:width" content="256"><meta property="og:image:height" content="256"><meta property="og:image:alt" content="棒球比赛记录大师 App Logo">
  <meta name="twitter:card" content="summary"><meta name="twitter:image" content="https://baseballmaster.cc/assets/app-icon.png?v=20261014">
  <meta itemprop="image" content="https://baseballmaster.cc/assets/app-icon.png?v=20261014">
  <link rel="image_src" href="https://baseballmaster.cc/assets/app-icon.png?v=20261014">
  <link rel="icon" type="image/png" href="https://baseballmaster.cc/assets/app-icon.png?v=20261014"><link rel="apple-touch-icon" href="https://baseballmaster.cc/assets/app-icon.png?v=20261014">
  <link rel="stylesheet" href="/join/join.css">

<body>
  <main>
    <img src="/assets/app-icon.png" width="72" height="72" alt="棒球比赛记录大师">
    <p class="eyebrow">BASEBALL MASTER</p>
    <h1>受邀加入球队</h1>
    <p id="message">在 App 中核对球队名称和角色，再确认加入。无需注册账号。</p>
    <a id="open-app" class="button" hidden>打开 App 核对邀请</a>
    <a class="button secondary" href="https://apps.apple.com/cn/app/id6802063886" rel="noreferrer">下载 iOS App</a>
    <p class="note">尚未安装？下载后回到此页面，点击「打开 App 核对邀请」。请使用支持球队共享的 3.0 或更新版本。</p>
    <button id="copy-link" hidden>复制邀请链接</button>
    <p class="note">也可在 App 的「球队 → 球队共享 → 通过邀请加入」粘贴链接。旧版单次邀请和新版球队固定邀请都可以使用：单次邀请在 24 小时内有效，使用后失效；固定邀请可供多人加入，管理员更换后旧链接失效。请在 App 中核对后加入。</p>
    <p id="status" role="status"></p>
  </main>
  <script src="/join/join.js"></script>
</body>
</html>
