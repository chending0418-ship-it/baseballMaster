# Merge INSIDE the dedicated HTTPS server {} for baseballmaster.cc.
# Set root to /www/wwwroot/baseballmaster.cc and upload ONLY website/public/ contents.
# Keep the site's SSL and ACME challenge settings. Do not duplicate matching locations.
location = / {
    try_files /index.html =404;
}
location = /index.html {
    try_files $uri =404;
}
location = /privacy.html {
    try_files $uri =404;
}
location = /support.html {
    try_files $uri =404;
}
location = /robots.txt {
    try_files $uri =404;
}
location = /sitemap.xml {
    try_files $uri =404;
}
location ^~ /assets/ {
    try_files $uri =404;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
}
# Keep this fallback when adding the live proxy locations later.
location / {
    return 404;
}
