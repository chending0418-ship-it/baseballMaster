# Dedicated BaseballMaster public website. Installed 2026-09-28.
# Keep this file separate from other sites. Only website/public/ belongs in this root.
server {
    listen 80;
    listen [::]:80;
    server_name baseballmaster.cc www.baseballmaster.cc;
    root /www/wwwroot/baseballmaster.cc;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://baseballmaster.cc$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name baseballmaster.cc www.baseballmaster.cc;
    root /www/wwwroot/baseballmaster.cc;
    index index.html;
    charset utf-8;
    ssl_certificate /www/server/panel/vhost/cert/baseballmaster.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/baseballmaster.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_session_cache shared:BASEBALLMASTER:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    autoindex off;
    access_log /www/wwwlogs/baseballmaster.cc.log;
    error_log /www/wwwlogs/baseballmaster.cc.error.log;
    if ($host = www.baseballmaster.cc) {
        return 308 https://baseballmaster.cc$request_uri;
    }
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location = /privacy.html {
        try_files $uri =404;
    }
    location = /support.html {
        try_files $uri =404;
    }
    location = /robots.txt {
        try_files $uri =404;
    }
    location = /sitemap.xml {
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        return 404;
    }
}
